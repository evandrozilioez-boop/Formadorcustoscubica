name = "formadorcustoscubica"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
main = "src/index.js"

[assets]
directory = "public"
binding = "ASSETS"

# Segurança (defina como variáveis/secrets no painel, NÃO aqui):
#   JWT_SECRET   = segredo forte e aleatório (obrigatório)
#   ACCESS_TEAM  = prefixo do time (de SEU-TIME.cloudflareaccess.com)
#   ACCESS_AUD   = Application Audience (AUD) Tag do Cloudflare Access
#   (NÃO defina OPEN_SESSION em produção — deixa a API aberta; só para teste)
# Veja SEGURANCA.md.

# PostgreSQL via Cloudflare Hyperdrive.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "e7d90c77eaea4feeb9b3568abccb02c6"
