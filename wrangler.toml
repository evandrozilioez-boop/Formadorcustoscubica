name = "formadorcustoscubica"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
main = "src/index.js"

[assets]
directory = "public"
binding = "ASSETS"

# Segurança (defina como variáveis/secrets no painel, NÃO aqui):
#   JWT_SECRET     = segredo forte e aleatório (obrigatório)
#   ADMIN_EMAIL    = e-mail do administrador inicial (opcional)
#   ADMIN_PASSWORD = senha do administrador inicial (opcional)
# A proteção é o login por senha (hash no PostgreSQL) + token JWT. Sem Cloudflare Access.
# Veja SEGURANCA.md.

# PostgreSQL via Cloudflare Hyperdrive.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "e7d90c77eaea4feeb9b3568abccb02c6"
