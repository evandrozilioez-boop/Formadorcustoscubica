name = "precificador"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "public"

# PostgreSQL via Cloudflare Hyperdrive.
# Crie o Hyperdrive apontando para o seu Postgres (PlanetScale Postgres faturado
# pela Cloudflare, ou Neon/Supabase/RDS) e cole o id abaixo.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "COLE_O_ID_DO_HYPERDRIVE_AQUI"
